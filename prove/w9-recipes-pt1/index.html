<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">

    <title>Recipe Book</title>
</head>

<body>

    <header class="site-header">
        <div class="logo">
            <img src="images/recipe-book.png" alt="RecipeBook logo">
            <span class="logo-text">RecipeBook</span>
        </div>
    </header>

    <main class="main-content">
        <div class="search-bar">
            <input type="search" placeholder="Find a recipe" aria-label="Find a recipe">
            <button type="button" aria-label="Search">
                <img src="images/search-icon.svg" alt="">
            </button>
        </div>

        <div class="recipe-list">

            
            <article class="recipe-card">
                <div class="card-image-wrap">
                    <img src="images/apple-crisp.jpg" alt="Apple Crisp in a bowl with ice cream">
                </div>
                <div class="card-body">
                    <span class="tag">dessert</span>
                    <h2 class="recipe-title">Apple Crisp</h2>
                    <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">☆</span>
                    </span>
                    <p class="recipe-desc">This apple crisp recipe is a simple yet delicious fall dessert that's great
                        served warm with vanilla ice cream.</p>
                </div>
            </article>

        </div>
    </main>

    <footer class="site-footer">
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons" class="attribution">
            Recipe icons created by Freepik - Flaticon
        </a>
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
        <div class="social">
            <a href="#" aria-label="Instagram"><img src="images/instagram_icon.svg" alt="Instagram"></a>
            <a href="#" aria-label="YouTube"><img src="images/youtube_icon.svg" alt="YouTube"></a>
            <a href="#" aria-label="Pinterest"><img src="images/pinterest_icon.svg" alt="Pinterest"></a>
        </div>

    </footer>
    </footer>

</html>
