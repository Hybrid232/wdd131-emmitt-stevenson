<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="The Soul of the Flame's character card is here!">
    <meta property="og:url" content="https://yourURLofPage.here">
    <meta property="og:image" content="https://i.pinimg.com/736x/7b/59/d7/7b59d78dfa734bb90990070efda497cf.jpg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="Twitter Page">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="The Soul of the Flame's character card is here!">
    <meta name="twitter:image" content="https://i.pinimg.com/736x/7b/59/d7/7b59d78dfa734bb90990070efda497cf.jpg">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Character Card</title>
</head>

<body>
    <main>
        <div class="card">
            <img class="image" src="images/soul-knight.jpg" alt="Character portrait">
            <div class="name">Soul of the Flame</div>
            <div class="stats">
                <p> <strong>Class:</strong> Chosen Undead</p>
                <p id="level"> <strong>Level:</strong> 10</p>
                <p id="health"> <strong>HP:</strong> 120 / 120</p>
            </div>
            <div class="buttons">
                <button id="attacked">Attacked</button>
                <button id="level-up">Level Up</button>
            </div>
        </div>
    </main>
</body>

</html>
