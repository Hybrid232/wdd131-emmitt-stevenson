<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="ticket-menu">
        <h1>Event Ticket</h1>

        <!-- Ticket Field -->
        <form id="ticketForm">

            <!-- First Name -->
            <div class="field">
                <label for="firstName">First Name</label>
                <input id="firstName" name="firstName" type="text" required />
            </div>

            <!-- Last Name -->
            <div class="field">
                <label for="lastName">Last Name</label>
                <input id="lastName" name="lastName" type="text" required />
            </div>
            
            <!-- Email -->
            <div class="field full">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required />
            </div>

            <!-- Field Type -->
            <div class="field">
                <label for="typeRange">Type</label>
                <select id="typeRange" name="typeRange" aria-controls="typeContainer" required >
                    <option value="">Choose One</option>
                    <option value="student">Student</option>
                    <option value="guest">Guest</option>
                </select>
            </div>

            <!-- Date -->
            <div class="field">
                <label for="eventDate">Event Date</label>
                <input id="eventDate" name="eventDate" type="date" required />
            </div>

            <!-- Student/Access Code Input -->
            <div id="fieldContainer" class="field full" hidden>
                <label for="ticketInput"></label>
                <input id="ticketInput" name="ticketInput" type="text" />
            </div>

            <!-- Submit Button -->
            <button class="full" type="submit">Create Ticket</button>
        </form>

        <section id="result" aria-live="polite"></section>
    </main>
</body>
</html>
